# yaml-language-server: $schema=./Kavita.ReleaseTools.schema.json

CsprojPath: "Kavita.ReleaseTools/Kavita.ReleaseTools.csproj"
VersionXmlElement: "Version"

ParseReleaseTypes:
  BranchRequirements:
    Stable:
      DoesNotContain: []
      StartWiths: ""

VersionBump:
  ComponentToBump: Build

RunScript:
  Executable: "dotnet"
  Arguments:
    - "run"
    - "--project"
    - "Kavita.ReleaseTools"
    - "generate-schema"
    - "-o"
    - "Kavita.ReleaseTools.schema.json"

FlushGitChanges:
  Files:
    - "Kavita.ReleaseTools/Kavita.ReleaseTools.csproj"
    - "Kavita.ReleaseTools.schema.json"

BuildLibrary:
  CsprojPath: "Kavita.ReleaseTools/Kavita.ReleaseTools.csproj"
  OutputDirectory: "output"

PublishToNuGet:
  OutputDirectory: "output"
